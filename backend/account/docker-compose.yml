x-service-env: &service-env
  SERVICE_NAME: account
  DATABASE_HOST: account-db
  DATABASE_NAME: account
  DATABASE_USER: account_app
  DATABASE_PASSWORD_FILE: /run/secrets/account-db-app-password

x-watch: &watch
  watch:
    - action: sync
      path: ./src
      target: /app/src
      ignore: [infra/generated/]
    - action: sync+restart
      path: ./contracts
      target: /app/contracts
    - action: sync
      path: ./migrations
      target: /app/migrations
    - action: rebuild
      path: ./package.json
    - action: rebuild
      path: ./package-lock.json
    - action: rebuild
      path: ./Dockerfile

services:
  account-db:
    image: postgres:17-alpine
    container_name: account-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/account-db-superuser-password
      DATABASE_NAME: account
      DATABASE_SCHEMA: account
      DATABASE_MIGRATOR_USER: account_migrator
      DATABASE_APP_USER: account_app
      DATABASE_MIGRATOR_PASSWORD_FILE: /run/secrets/account-db-migrator-password
      DATABASE_APP_PASSWORD_FILE: /run/secrets/account-db-app-password
    volumes:
      - account-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: account-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [trading-net]

  account-migrate:
    build: { context: ., target: dev }
    container_name: account-migrate
    command: ["npx", "tsx", "src/infra/main/migrate.ts"]
    environment:
      DATABASE_HOST: account-db
      DATABASE_NAME: account
      DATABASE_MIGRATOR_USER: account_migrator
      DATABASE_MIGRATOR_PASSWORD_FILE: /run/secrets/account-db-migrator-password
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: account-migrate
    depends_on:
      account-db:
        condition: service_healthy
    networks: [trading-net]

  account-api:
    build: { context: ., target: dev }
    container_name: account-api
    command: ["npx", "tsx", "watch", "src/infra/main/api.ts"]
    environment:
      <<: *service-env
      HTTP_PORT: "3000"
      GRPC_PORT: "50051"
      REDIS_HOST: redis
      REDIS_USER: account
      REDIS_PASSWORD_FILE: /run/secrets/account-redis-password
      WALLET_GRPC_ADDR: wallet-api:50051
      TLS_CA_FILE: /run/secrets/ca.crt
      TLS_CERT_FILE: /run/secrets/account.crt
      TLS_KEY_FILE: /run/secrets/account.key
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:50051:50051"
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: account-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      account-migrate:
        condition: service_completed_successfully
    networks: [trading-net]
    develop: *watch

  account-worker:
    build: { context: ., target: dev }
    container_name: account-worker
    command: ["npx", "tsx", "watch", "src/infra/main/worker.ts"]
    environment:
      <<: *service-env
      HEALTH_PORT: "3001"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: account
      RABBITMQ_PASSWORD_FILE: /run/secrets/account-rabbitmq-password
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: account-worker
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      account-migrate:
        condition: service_completed_successfully
    networks: [trading-net]
    develop: *watch

networks:
  trading-net:
    name: trading-net
    driver: bridge

volumes:
  trading-secrets:
    name: trading-secrets
  account-db-data:
    name: account-db-data
