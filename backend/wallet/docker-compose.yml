x-service-env: &service-env
  SERVICE_NAME: wallet
  DATABASE_HOST: wallet-db
  DATABASE_NAME: wallet
  DATABASE_USER: wallet_app
  DATABASE_PASSWORD_FILE: /run/secrets/wallet-db-app-password

x-watch: &watch
  watch:
    - action: sync
      path: ./src
      target: /app/src
      ignore: [infra/generated/]
    - action: sync+restart
      path: ./contracts
      target: /app/contracts
    - action: sync
      path: ./migrations
      target: /app/migrations
    - action: rebuild
      path: ./package.json
    - action: rebuild
      path: ./package-lock.json
    - action: rebuild
      path: ./Dockerfile

services:
  wallet-db:
    image: postgres:17-alpine
    container_name: wallet-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/wallet-db-superuser-password
      DATABASE_NAME: wallet
      DATABASE_SCHEMA: wallet
      DATABASE_MIGRATOR_USER: wallet_migrator
      DATABASE_APP_USER: wallet_app
      DATABASE_MIGRATOR_PASSWORD_FILE: /run/secrets/wallet-db-migrator-password
      DATABASE_APP_PASSWORD_FILE: /run/secrets/wallet-db-app-password
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: wallet-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [trading-net]

  wallet-migrate:
    build: { context: ., target: dev }
    container_name: wallet-migrate
    command: ["npx", "tsx", "src/infra/main/migrate.ts"]
    environment:
      DATABASE_HOST: wallet-db
      DATABASE_NAME: wallet
      DATABASE_MIGRATOR_USER: wallet_migrator
      DATABASE_MIGRATOR_PASSWORD_FILE: /run/secrets/wallet-db-migrator-password
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: wallet-migrate
    depends_on:
      wallet-db:
        condition: service_healthy
    networks: [trading-net]

  wallet-api:
    build: { context: ., target: dev }
    container_name: wallet-api
    command: ["npx", "tsx", "watch", "src/infra/main/api.ts"]
    environment:
      <<: *service-env
      HTTP_PORT: "3000"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: wallet-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      wallet-migrate:
        condition: service_completed_successfully
    networks: [trading-net]
    develop: *watch

  wallet-worker:
    build: { context: ., target: dev }
    container_name: wallet-worker
    command: ["npx", "tsx", "watch", "src/infra/main/worker.ts"]
    environment:
      <<: *service-env
      HEALTH_PORT: "3001"
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: wallet-worker
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      wallet-migrate:
        condition: service_completed_successfully
    networks: [trading-net]
    develop: *watch

networks:
  trading-net:
    name: trading-net
    driver: bridge

volumes:
  trading-secrets:
    name: trading-secrets
  wallet-db-data:
    name: wallet-db-data
