x-service-env: &service-env
  SERVICE_NAME: matching
  DATABASE_HOST: matching-db
  DATABASE_NAME: matching
  DATABASE_USER: matching_app
  DATABASE_PASSWORD_FILE: /run/secrets/matching-db-app-password

x-watch: &watch
  watch:
    - action: sync
      path: ./src
      target: /app/src
      ignore: [infra/generated/]
    - action: sync+restart
      path: ./contracts
      target: /app/contracts
    - action: sync
      path: ./migrations
      target: /app/migrations
    - action: rebuild
      path: ./package.json
    - action: rebuild
      path: ./package-lock.json
    - action: rebuild
      path: ./Dockerfile

services:
  matching-db:
    image: postgres:17-alpine
    container_name: matching-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/matching-db-superuser-password
      DATABASE_NAME: matching
      DATABASE_SCHEMA: matching
      DATABASE_MIGRATOR_USER: matching_migrator
      DATABASE_APP_USER: matching_app
      DATABASE_MIGRATOR_PASSWORD_FILE: /run/secrets/matching-db-migrator-password
      DATABASE_APP_PASSWORD_FILE: /run/secrets/matching-db-app-password
    volumes:
      - matching-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: matching-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matching"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [trading-net]

  matching-migrate:
    build: { context: ., target: dev }
    container_name: matching-migrate
    command: ["npx", "tsx", "src/infra/main/migrate.ts"]
    environment:
      DATABASE_HOST: matching-db
      DATABASE_NAME: matching
      DATABASE_MIGRATOR_USER: matching_migrator
      DATABASE_MIGRATOR_PASSWORD_FILE: /run/secrets/matching-db-migrator-password
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: matching-migrate
    depends_on:
      matching-db:
        condition: service_healthy
    networks: [trading-net]

  matching-api:
    build: { context: ., target: dev }
    container_name: matching-api
    command: ["npx", "tsx", "watch", "src/infra/main/api.ts"]
    environment:
      <<: *service-env
      HTTP_PORT: "3000"
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: matching-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      matching-migrate:
        condition: service_completed_successfully
    networks: [trading-net]
    develop: *watch

  matching-worker:
    build: { context: ., target: dev }
    container_name: matching-worker
    command: ["npx", "tsx", "watch", "src/infra/main/worker.ts"]
    environment:
      <<: *service-env
      HEALTH_PORT: "3001"
    volumes:
      - type: volume
        source: trading-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: matching-worker
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      matching-migrate:
        condition: service_completed_successfully
    networks: [trading-net]
    develop: *watch

networks:
  trading-net:
    name: trading-net
    driver: bridge

volumes:
  trading-secrets:
    name: trading-secrets
  matching-db-data:
    name: matching-db-data
