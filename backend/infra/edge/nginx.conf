worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  limit_req_zone $binary_remote_addr zone=public:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=private:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  proxy_cache_path /var/cache/nginx/micro keys_zone=micro:10m inactive=10s use_temp_path=off;

  client_max_body_size 16k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  send_timeout 10s;
  keepalive_requests 100;
  keepalive_timeout 15s;

  default_type application/json;

  server {
    listen 80;

    limit_conn perip 20;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    error_page 502 503 504 = @upstreamDown;
    error_page 429 = @tooManyRequests;
    error_page 413 = @payloadTooLarge;

    location = /healthz {
      access_log off;
      return 200 '{"status":"ok"}';
    }

    location = /signup {
      limit_req zone=auth burst=5 nodelay;
      set $upstream http://account-api:3000;
      proxy_pass $upstream;
    }

    location ~ ^/accounts/[^/]+/orders/?$ {
      limit_req zone=private burst=20 nodelay;
      set $upstream http://order-api:3000;
      proxy_pass $upstream;
    }

    location ~ ^/accounts/[^/]+/?$ {
      limit_req zone=private burst=20 nodelay;
      set $upstream http://account-api:3000;
      proxy_pass $upstream;
    }

    location ~ ^/orders/[^/]+/?$ {
      limit_req zone=private burst=20 nodelay;
      set $upstream http://order-api:3000;
      proxy_pass $upstream;
    }

    location ~ ^/(deposit|withdraw)$ {
      limit_req zone=private burst=20 nodelay;
      set $upstream http://wallet-api:3000;
      proxy_pass $upstream;
    }

    location ~ ^/(place_order|cancel_order)$ {
      limit_req zone=private burst=20 nodelay;
      set $upstream http://order-api:3000;
      proxy_pass $upstream;
    }

    location ~ ^/markets/ {
      limit_req zone=public burst=40 nodelay;
      proxy_cache micro;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;
      proxy_cache_use_stale updating;
      proxy_cache_key "$request_method$request_uri";
      add_header X-Cache-Status $upstream_cache_status always;
      set $upstream http://market-data-api:3000;
      proxy_pass $upstream;
    }

    location / {
      return 404 '{"error":"notFound"}';
    }

    location @upstreamDown {
      return 502 '{"error":"upstreamUnavailable"}';
    }

    location @tooManyRequests {
      add_header Retry-After 1 always;
      return 429 '{"error":"tooManyRequests"}';
    }

    location @payloadTooLarge {
      return 413 '{"error":"payloadTooLarge"}';
    }
  }
}
