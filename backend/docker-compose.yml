name: trading

include:
  - infra/docker-compose.yml
  - path:
      - account/docker/docker-compose.yml
      - account/docker/docker-compose.platform.yml
    env_file: account/.env
  - path:
      - wallet/docker/docker-compose.yml
      - wallet/docker/docker-compose.platform.yml
    env_file: wallet/.env
  - path:
      - order/docker/docker-compose.yml
      - order/docker/docker-compose.platform.yml
    env_file: order/.env
